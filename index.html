<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Race Clock</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #0b0f14; color: #e8eef7; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 3vh 4vw; }
    .card { width: min(1100px, 96vw); }
    .row { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    .label { letter-spacing: .12em; opacity: .75; font-weight: 700; font-size: 1.2rem; }
    .big { font-weight: 800; font-size: clamp(56px, 10vw, 140px); line-height: 1; }
    .mid { font-weight: 800; font-size: clamp(34px, 5vw, 72px); line-height: 1.1; }
    .small { font-size: clamp(18px, 2.3vw, 28px); opacity: .9; }
    .muted { opacity: .7; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .box { padding: 1.2rem 1.4rem; border-radius: 18px; background: rgba(255,255,255,.06); }
    .box.raceBox { background: rgba(255, 70, 70, .14); border: 1px solid rgba(255, 70, 70, .25); }
    .error { color: #ff9c9c; font-weight: 700; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    @media (max-width: 920px) { .split { grid-template-columns: 1fr; } }
    .kpi { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    /* Stable digit width + reserved line height so boxes don’t jump when values change */
    .nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .slot-mid {
      min-height: calc(1.1 * clamp(34px, 5vw, 72px));
      display: flex;
      align-items: center;
    }
    .slot-big {
      min-height: clamp(56px, 10vw, 140px);
      display: flex;
      align-items: center;
    }
    .nums.midW { min-width: 9ch; display: inline-block; text-align: center; }
    .nums.bigW { min-width: 9ch; display: inline-block; text-align: center; }
    .listBlock { min-height: 4.5em; }
    .titleReserve { min-height: 2.75em; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="grid2">
          <div class="box">
            <div class="label">CURRENT TIME</div>
            <div class="slot-mid"><div id="now" class="mid nums midW">00:00:00</div></div>
            <div id="tz" class="small muted"></div>
          </div>

          <div class="box">
            <div class="label">NEXT TASK TIME</div>
            <div class="slot-mid"><div id="nextTaskTime" class="mid nums midW">00:00</div></div>
            <div id="nextTaskName" class="small">—</div>
          </div>
        </div>

        <div class="split">
          <div class="box">
            <div class="label">COUNTDOWN TO NEXT TASK</div>
            <div id="taskCountdownTitle" class="small muted titleReserve" style="margin-bottom:.35rem;"></div>
            <div class="kpi">
              <div class="slot-big"><div id="taskCountdown" class="big nums bigW">00:00:00</div></div>
            </div>
            <div id="active" class="small muted"></div>
            <div id="msg" class="small error"></div>
          </div>

          <div class="box raceBox">
            <div class="label">COUNTDOWN TO NEXT RACE</div>
            <div id="raceCountdownTitle" class="small muted titleReserve" style="margin-bottom:.35rem;"></div>
            <div class="kpi">
              <div class="slot-big"><div id="raceCountdown" class="big nums bigW">00:00:00</div></div>
            </div>
            <div class="small muted" id="raceMeta"></div>
          </div>
        </div>

        <div class="grid2">
          <div class="box">
            <div class="label">UP NEXT (TASKS)</div>
            <div id="upNextTasks" class="small listBlock">Loading…</div>
          </div>
          <div class="box raceBox">
            <div class="label">UP NEXT (RACES)</div>
            <div id="upNextRaces" class="small listBlock">Loading…</div>
          </div>
        </div>

      </div>
    </div>
  </div>

<script>
/**
 * CONFIG
 * Google Sheets published CSV URL.
 * - column A: boundary times (HH:MM). Each row starts a block that runs until the next row’s time.
 *   The last time is end-of-window (no separate block after it). Column B is ignored.
 * - column C: name/description for the block that starts at that row’s time
 * Event date: row 21 in column C or D, or any row whose column A is “Date” (value in B, C, or D).
 */
const CSV_URL_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbnxuPH_HDH9RdFUQmau6T_fX-FjygDnR-TNe6YJt5lf8vuG7Ls8TfopG4pTQOEL5b9V0QwKD3kdjM/pub?gid=503242164&single=true&output=csv";

// Cache-busting per fetch (important: Date.now() must be evaluated each time)
function csvUrl(){
  return `${CSV_URL_BASE}${CSV_URL_BASE.includes("?") ? "&" : "?"}t=${Date.now()}`;
}

const COL_TIME = 0;
const COL_NAME = 2;

// Event date row (1-based row 21 → index 20). Value may be in C or D depending on layout.
const DATE_CELL_ROW = 21 - 1; // 20
const DATE_VALUE_COLS = [2, 3, 1]; // C, D, B — try in that order

// Refresh schedule from CSV every N seconds (UI clock still ticks every second)
const SCHEDULE_REFRESH_SECONDS = 4;

/** @type {{ startSec: number, endSec: number, startMin: number, name: string, timeStr: string }[]} */
let schedule = [];
let windowEndSec = null; // sailing day ends at this second-of-day (local)
let lastFetchMs = 0;
let eventDateKey = null; // YYYY-MM-DD from C21
let loadError = "";

function pad2(n){ return String(n).padStart(2,"0"); }

function formatHMS(d){
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

function formatHMfromSeconds(sec){
  const m = Math.floor(sec / 60);
  const hh = Math.floor(m / 60) % 24;
  const mm = m % 60;
  return `${pad2(hh)}:${pad2(mm)}`;
}

/** HH:MM:00 — same width as live clock (tabular nums + 9ch slot). */
function formatHMwithFixedSec(sec){
  return `${formatHMfromSeconds(sec)}:00`;
}

function nowSecondsOfDay(d){
  return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
}

/** Always HH:MM:SS so width stays constant (with tabular nums). */
function formatCountdown(deltaSec){
  const hh = Math.floor(deltaSec / 3600);
  const mm = Math.floor((deltaSec % 3600) / 60);
  const ss = deltaSec % 60;
  return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
}

function dateKeyLocal(d){
  // local date as YYYY-MM-DD
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

/** Google/Excel serial whole days since 1899-12-30 (UTC). */
function serialDayToKey(serialInt){
  const n = Math.floor(Number(serialInt));
  if (Number.isNaN(n) || n < 1 || n > 80000) return null;
  const base = Date.UTC(1899, 11, 30);
  const d = new Date(base + n * 86400000);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
}

function parseDateToKey(s){
  if (s === undefined || s === null) return null;
  const raw = String(s).trim();
  if (!raw) return null;

  // ISO: YYYY-MM-DD (recommended)
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;

  // Slash dates: interpret as DD/MM/YYYY (e.g. 10/04/2026 → 10 Apr 2026)
  const dmy = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (dmy){
    const dd = Number(dmy[1]), mm = Number(dmy[2]), yy = Number(dmy[3]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return `${yy}-${pad2(mm)}-${pad2(dd)}`;
  }

  // Sometimes Sheets exports a full datetime; try extracting YYYY-MM-DD
  const isoInText = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (isoInText) return `${isoInText[1]}-${isoInText[2]}-${isoInText[3]}`;

  // Plain serial day number from CSV (no meaningful time fraction)
  const asNum = Number(raw.replace(",", "."));
  if (!Number.isNaN(asNum) && asNum >= 1 && asNum < 80000){
    const day = Math.round(asNum);
    if (Math.abs(asNum - day) < 1e-5){
      const key = serialDayToKey(day);
      if (key) return key;
    }
  }

  return null;
}

function parseEventDateFromRows(rows){
  if (!rows?.length) return null;
  const r = rows[DATE_CELL_ROW];
  if (r){
    for (const c of DATE_VALUE_COLS){
      const key = parseDateToKey(r[c]);
      if (key) return key;
    }
  }
  for (let i = 0; i < rows.length; i++){
    const label = (rows[i][COL_TIME] ?? "").trim().toLowerCase();
    if (label !== "date") continue;
    for (const c of DATE_VALUE_COLS){
      const key = parseDateToKey(rows[i][c]);
      if (key) return key;
    }
  }
  return null;
}

function parseTimeToMinutes(s){
  if (s === undefined || s === null) return null;
  const raw = String(s).trim();
  if (!raw) return null;

  // 12-hour with AM/PM must run before generic H:MM — otherwise "1:25:00 PM" is read as 01:25.
  const ampmFull = raw.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])\b/);
  if (ampmFull){
    let hh = Number(ampmFull[1]);
    const mm = Number(ampmFull[2]);
    const ap = ampmFull[4].toUpperCase();
    if (hh >= 1 && hh <= 12 && mm >= 0 && mm <= 59){
      if (ap === "PM" && hh !== 12) hh += 12;
      if (ap === "AM" && hh === 12) hh = 0;
      return hh * 60 + mm;
    }
  }

  // 24-hour H:MM(:SS) — prefer a match that looks like clock time, not a small decimal
  const timeMatch = raw.match(/(?:^|\s|T)(\d{1,2}):(\d{2})(?::(\d{2}))?(?!\s*[AaPp][Mm])/);
  if (timeMatch) {
    const hh = Number(timeMatch[1]);
    const mm = Number(timeMatch[2]);
    if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59) return hh * 60 + mm;
  }

  const asNum = Number(raw.replace(",", "."));
  if (!Number.isNaN(asNum) && asNum > 0 && asNum < 1){
    const minutes = Math.round((asNum % 1) * 24 * 60);
    return (minutes >= 0 && minutes < 24 * 60) ? minutes : null;
  }
  // Datetime serial: day + fraction (time in day)
  if (!Number.isNaN(asNum) && asNum >= 1 && asNum < 80000){
    const frac = asNum % 1;
    if (frac > 1e-9 && frac < 1 - 1e-9){
      const minutes = Math.round(frac * 24 * 60);
      if (minutes >= 0 && minutes < 24 * 60) return minutes;
    }
  }

  return null;
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");

  const firstLine = text.split(/\r?\n/).find(l => l.trim().length > 0) || "";
  const commaCount = (firstLine.match(/,/g) || []).length;
  const semiCount  = (firstLine.match(/;/g) || []).length;
  const delim = semiCount > commaCount ? ";" : ",";

  const rows = [];
  let row = [], cell = "", inQ = false;

  for (let i=0; i<text.length; i++){
    const c = text[i];
    const n = text[i+1];

    if (inQ){
      if (c === '"' && n === '"'){ cell += '"'; i++; }
      else if (c === '"'){ inQ = false; }
      else { cell += c; }
    } else {
      if (c === '"'){ inQ = true; }
      else if (c === delim){ row.push(cell); cell = ""; }
      else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c === '\r'){ /* ignore */ }
      else { cell += c; }
    }
  }
  row.push(cell);
  rows.push(row);
  return rows;
}

async function loadSchedule(){
  try{
    loadError = "";
    const url = csvUrl();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`CSV fetch failed: ${res.status} ${res.statusText} (url: ${url})`);

    const txt = await res.text();
    const rows = parseCSV(txt);

    eventDateKey = parseEventDateFromRows(rows);
    if (!eventDateKey){
      loadError =
        "Could not parse event date (put it in C21 or D21, or a “Date” row with the value in B/C/D). Use YYYY-MM-DD or DD/MM/YYYY.";
    }

    const markers = [];
    for (let r = 0; r < rows.length; r++){
      const timeStr = (rows[r][COL_TIME] ?? "").trim();
      const name = (rows[r][COL_NAME] ?? "").trim();
      const startMin = parseTimeToMinutes(timeStr);
      if (startMin === null) continue;
      markers.push({ startMin, name, timeStr });
    }

    markers.sort((a, b) => a.startMin - b.startMin);

    // Two rows at the same clock time create two phases with the same startSec (e.g. 10:00→10:00
    // and 10:00→11:00). “Up next” then showed that time twice after skipping the hero row.
    const merged = [];
    for (const m of markers){
      const prev = merged[merged.length - 1];
      if (prev && prev.startMin === m.startMin){
        if (m.name) prev.name = m.name;
        prev.timeStr = m.timeStr;
      } else {
        merged.push({ startMin: m.startMin, name: m.name, timeStr: m.timeStr });
      }
    }
    markers.length = 0;
    markers.push(...merged);

    if (markers.length < 2){
      schedule = [];
      windowEndSec = markers.length === 1 ? markers[0].startMin * 60 : null;
    } else {
      const phases = [];
      for (let i = 0; i < markers.length - 1; i++){
        phases.push({
          startSec: markers[i].startMin * 60,
          endSec: markers[i + 1].startMin * 60,
          startMin: markers[i].startMin,
          name: markers[i].name,
          timeStr: markers[i].timeStr,
        });
      }
      schedule = phases;
      windowEndSec = markers[markers.length - 1].startMin * 60;
    }
    lastFetchMs = Date.now();
  } catch (e){
    loadError = String(e);
  }
}

// ---- RACE DETECTION RULE ----
// Count actual race blocks (e.g. "Race 1 (A1)…"), not pit-lane rows like "Pit lane - Race 2…".
function isRace(ev){
  return (ev.name || "").trim().toLowerCase().startsWith("race");
}

/** One entry per start time (sheet sometimes has two rows at the same boundary). */
function dedupeByStartSec(phases){
  const out = [];
  for (const ev of phases){
    if (out.length && out[out.length - 1].startSec === ev.startSec) continue;
    out.push(ev);
  }
  return out;
}

// Next phase start after `now` among matching rows (no wrap to tomorrow)
function secondsUntilNextMatching(now, predicate){
  if (!schedule.length) return null;

  const items = predicate ? schedule.filter(predicate) : schedule.slice();
  if (!items.length) return null;

  const nowSec = nowSecondsOfDay(now);
  const next = items.find(ev => ev.startSec > nowSec);
  if (!next) return null;

  const deltaSec = Math.max(0, next.startSec - nowSec);
  return { next, deltaSec };
}

function isSailingWindowClosed(now){
  if (eventDateKey){
    const todayKey = dateKeyLocal(now);
    if (todayKey !== eventDateKey) return true;
  }

  if (windowEndSec == null && !schedule.length) return false;

  const nowSec = nowSecondsOfDay(now);
  if (windowEndSec == null) return false;
  return nowSec >= windowEndSec;
}

function findActive(now){
  if (!schedule.length) return null;

  const nowSec = nowSecondsOfDay(now);
  if (nowSec < schedule[0].startSec) return null;

  for (const ev of schedule){
    if (nowSec >= ev.startSec && nowSec < ev.endSec) return ev;
  }
  return null;
}

function render(){
  const now = new Date();
  document.getElementById("now").textContent = formatHMS(now);
  document.getElementById("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || "";

  document.getElementById("msg").textContent = loadError;

  const closed = isSailingWindowClosed(now);
  if (closed){
    document.getElementById("nextTaskTime").textContent = "--:--:--";
    document.getElementById("nextTaskName").textContent = "SAILING WINDOW CLOSED";

    document.getElementById("taskCountdownTitle").textContent = "";
    document.getElementById("taskCountdown").textContent = "--:--:--";
    document.getElementById("active").textContent = "";

    document.getElementById("raceCountdownTitle").textContent = "";
    document.getElementById("raceCountdown").textContent = "--:--:--";
    document.getElementById("raceMeta").textContent = "";

    document.getElementById("upNextTasks").innerHTML = "<div>SAILING WINDOW CLOSED</div>";
    document.getElementById("upNextRaces").innerHTML = "<div>SAILING WINDOW CLOSED</div>";

    if (eventDateKey && !loadError){
      document.getElementById("msg").textContent = `Sailing window ended · Event date: ${eventDateKey}`;
    }
    return;
  }

  // NEXT TASK (any row)
  const nextTaskInfo = secondsUntilNextMatching(now, null);

  if (nextTaskInfo){
    const { next, deltaSec } = nextTaskInfo;
    document.getElementById("nextTaskTime").textContent = formatHMwithFixedSec(next.startSec);
    document.getElementById("nextTaskName").textContent = next.name ? next.name : "—";
    document.getElementById("taskCountdownTitle").textContent = next.name ? next.name : "";
    document.getElementById("taskCountdown").textContent = formatCountdown(deltaSec);
  } else {
    document.getElementById("nextTaskTime").textContent = "--:--:--";
    document.getElementById("nextTaskName").textContent = "No upcoming tasks";
    document.getElementById("taskCountdownTitle").textContent = "";
    document.getElementById("taskCountdown").textContent = "--:--:--";
  }

  // NEXT RACE (race rows only)
  const nextRaceInfo = secondsUntilNextMatching(now, isRace);

  if (nextRaceInfo){
    const { next, deltaSec } = nextRaceInfo;
    document.getElementById("raceCountdownTitle").textContent = next.name ? next.name : "Next race";
    document.getElementById("raceCountdown").textContent = formatCountdown(deltaSec);
    document.getElementById("raceMeta").textContent = `Race time: ${formatHMwithFixedSec(next.startSec)}`;
  } else {
    document.getElementById("raceCountdownTitle").textContent = schedule.length ? "No upcoming races" : "";
    document.getElementById("raceCountdown").textContent = "--:--:--";
    document.getElementById("raceMeta").textContent =
      schedule.length ? "Label races in column C with text starting with “Race”." : "";
  }

  const nowSec = nowSecondsOfDay(now);
  const active = findActive(now);
  if (active?.name){
    const ends = formatHMwithFixedSec(active.endSec);
    document.getElementById("active").textContent = `NOW: ${active.name} · until ${ends}`;
  } else if (schedule.length && nowSec < schedule[0].startSec){
    document.getElementById("active").textContent =
      ``;
  } else {
    document.getElementById("active").textContent = schedule.length ? "Between scheduled blocks" : "";
  }

  // Up next — starts *after* the immediate next item (same as countdown boxes above),
  // so we don’t repeat that row here.
  if (schedule.length){
    const aheadTasks = dedupeByStartSec(
      schedule
        .filter(ev => ev.startSec > nowSec)
        .sort((a, b) => a.startSec - b.startSec)
    );
    const upcomingTasks = aheadTasks
      .slice(1, 4)
      .map(ev => `${formatHMfromSeconds(ev.startSec)} — ${ev.name || "(no label)"}`);

    let tasksHtml;
    if (upcomingTasks.length){
      tasksHtml = upcomingTasks.map(line => `<div>${line}</div>`).join("");
    } else if (!aheadTasks.length){
      tasksHtml = "<div>No upcoming tasks</div>";
    } else {
      tasksHtml = "<div class=\"muted\">Nothing scheduled after that</div>";
    }
    document.getElementById("upNextTasks").innerHTML = tasksHtml;

    const aheadRaces = dedupeByStartSec(
      schedule
        .filter(isRace)
        .filter(ev => ev.startSec > nowSec)
        .sort((a, b) => a.startSec - b.startSec)
    );
    const upcomingRaces = aheadRaces
      .slice(1, 4)
      .map(ev => `${formatHMfromSeconds(ev.startSec)} — ${ev.name || "(no label)"}`);

    let racesHtml;
    if (upcomingRaces.length){
      racesHtml = upcomingRaces.map(line => `<div>${line}</div>`).join("");
    } else if (!aheadRaces.length){
      racesHtml = "<div>No upcoming races</div>";
    } else {
      racesHtml = "<div class=\"muted\">Nothing scheduled after that</div>";
    }
    document.getElementById("upNextRaces").innerHTML = racesHtml;
  } else {
    document.getElementById("upNextTasks").textContent = "";
    document.getElementById("upNextRaces").textContent = "";
  }
}

async function tick(){
  const nowMs = Date.now();
  if (!lastFetchMs || (nowMs - lastFetchMs) > SCHEDULE_REFRESH_SECONDS*1000){
    await loadSchedule();
  }
  render();
}

(async function init(){
  if (!CSV_URL_BASE){
    document.getElementById("msg").textContent = "CSV_URL_BASE is empty.";
  } else {
    await loadSchedule();
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
