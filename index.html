<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Race Clock</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --surface-glass: rgba(75, 85, 98, 0.055);
      --surface-glass-deep: rgba(75, 85, 98, 0.095);
      /* #002164 — rgb(0, 33, 100), tinted glass over white */
      --race-glass: rgba(0, 33, 100, 0.1);
      --race-glass-deep: rgba(0, 33, 100, 0.17);
      --text: #141820;
      --text-muted: #3d4752;
      --digits: #0a0a0a;
      --race-text: #0a1730;
      --race-muted: rgba(0, 33, 100, 0.62);
      --race-digits: #002164;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-page);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .wrap {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: clamp(0.5rem, 1.8vmin, 1.25rem) clamp(0.5rem, 2.5vw, 1.5rem);
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: clamp(0.65rem, 2.2vmin, 1.35rem);
      flex: 1 1 auto;
      min-height: 0;
      box-sizing: border-box;
    }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(0.15rem, 1vmin, 0.5rem) 0;
      flex: 0 0 auto;
    }
    .brand-logo {
      width: min(92%, 720px);
      height: auto;
      max-height: clamp(36px, min(11vw, 12vh), 96px);
      object-fit: contain;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(0.65rem, 2.2vmin, 1.1rem);
      width: 100%;
      justify-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
    }
    .label {
      letter-spacing: 0.14em;
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-align: center;
    }
    .raceBox .label { color: rgba(0, 33, 100, 0.72); }
    .big {
      font-weight: 800;
      font-size: clamp(36px, min(9vw, 11vh), 128px);
      line-height: 1;
      color: var(--digits);
    }
    .mid {
      font-weight: 800;
      font-size: clamp(22px, min(5vw, 6vh), 72px);
      line-height: 1.08;
      color: var(--digits);
    }
    .small { font-size: clamp(14px, min(2.2vw, 2.8vh), 26px); color: var(--text); }
    .muted { color: var(--text-muted); }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(0.65rem, 2.2vmin, 1.1rem);
      width: 100%;
      align-items: stretch;
    }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    /* Top row: equal column heights; time rows share space; task name footer on the right */
    .pair-row { align-items: stretch; }
    .pair-row > .box {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .pair-row .box-current-time > .slot-mid {
      flex: 1 1 auto;
    }
    .box-next-task > .next-task-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
    }
    .box-next-task .next-task-body .slot-mid {
      flex: 0 0 auto;
    }
    .box-next-task.next-task-empty .next-task-body .slot-mid {
      display: none;
    }
    .box {
      padding: clamp(0.65rem, 2.2vmin, 1.5rem) clamp(0.75rem, 2.5vw, 1.75rem);
      border-radius: clamp(10px, 1.2vmin, 14px);
      background: linear-gradient(180deg, var(--surface-glass) 0%, var(--surface-glass-deep) 100%);
      border: none;
      box-shadow: 0 1px 3px rgba(15, 25, 40, 0.04);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      box-sizing: border-box;
      min-width: 0;
    }
    .box.raceBox {
      background: linear-gradient(165deg, var(--race-glass) 0%, var(--race-glass-deep) 100%);
      border: none;
      box-shadow: 0 1px 4px rgba(0, 33, 100, 0.06);
    }
    .raceBox .big,
    .raceBox .mid { color: var(--race-digits); }
    .raceBox .small { color: var(--race-text); }
    .raceBox .muted { color: var(--race-muted); }
    .error { color: #b71c1c; font-weight: 700; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(0.65rem, 2.2vmin, 1.1rem);
      width: 100%;
      align-items: stretch;
    }
    @media (max-width: 920px) { .split { grid-template-columns: 1fr; } }
    .kpi {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      width: 100%;
    }
    .nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .slot-mid {
      min-height: calc(1.15 * clamp(26px, min(4.5vw, 5.5vh), 64px));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot-big {
      min-height: clamp(44px, min(8vw, 10vh), 120px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .raceBox .slot-big {
      height: clamp(44px, min(8vw, 10vh), 120px);
      box-sizing: border-box;
    }
    #raceCountdown.is-closed {
      font-size: clamp(15px, 2.65vw, 26px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      color: var(--race-digits);
      white-space: normal;
      text-align: center;
      max-width: 26ch;
      min-width: 0 !important;
      margin-inline: auto;
    }
    .nums.midW { min-width: 8ch; display: inline-block; text-align: center; }
    .nums.bigW { min-width: 8ch; display: inline-block; text-align: center; }
    .box-current-time .slot-mid {
      justify-content: center;
      align-items: center;
    }
    .listBlock {
      min-height: 4em;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .box-up-next {
      min-height: 0;
    }
    .box-up-next .upnext-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      min-height: 5.5em;
    }
    .box-up-next .upnext-body .listBlock {
      min-height: 0;
      justify-content: center;
    }
    /* One column, left-aligned text; whole column centered in the box so times line up */
    .listBlock-inner {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35em;
      width: max-content;
      max-width: 100%;
      margin-inline: auto;
      text-align: left;
    }
    .listBlock > .upnext-msg {
      width: 100%;
      text-align: center;
    }
    .upnext-line {
      display: grid;
      grid-template-columns: 5.25ch auto minmax(0, 1fr);
      gap: 0 0.45em;
      align-items: baseline;
      justify-items: start;
      width: 100%;
      min-width: 0;
      text-align: left;
    }
    .upnext-time {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      text-align: right;
      justify-self: end;
    }
    .upnext-sep {
      opacity: 0.65;
      justify-self: center;
    }
    .upnext-name {
      min-width: 0;
      word-break: break-word;
    }
    .upnext-line--name-only {
      display: block;
      width: 100%;
      text-align: left;
    }
    .upnext-line--name-only .upnext-name {
      display: block;
    }
    .titleReserve {
      min-height: 2.35em;
      width: 100%;
      text-align: center;
    }
    #taskCountdownTitle,
    #raceCountdownTitle {
      text-align: center;
    }
    #nextTaskName {
      width: 100%;
      text-align: center;
    }
    #active {
      width: 100%;
      text-align: center;
    }
    #msg {
      width: 100%;
      text-align: center;
      margin-top: clamp(0.65rem, 2.2vmin, 1.25rem);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header class="brand">
        <img class="brand-logo" src="ger-sailgp-logo.png" width="360" height="80" alt="Germany SailGP Team" />
      </header>
      <div class="row">
        <div class="grid2 pair-row">
          <div class="box box-current-time">
            <div class="label">Current time</div>
            <div class="slot-mid"><div id="now" class="mid nums midW">00:00:00</div></div>
          </div>

          <div class="box box-next-task" id="nextTaskBox">
            <div class="label">Next task time</div>
            <div class="next-task-body">
              <div class="slot-mid"><div id="nextTaskTime" class="mid nums midW">00:00</div></div>
              <div id="nextTaskName" class="small muted next-task-meta">—</div>
            </div>
          </div>
        </div>

        <div class="split">
          <div class="box">
            <div class="label">Countdown to next task</div>
            <div id="taskCountdownTitle" class="small muted titleReserve" style="margin-bottom:.35rem;"></div>
            <div class="kpi">
              <div class="slot-big"><div id="taskCountdown" class="big nums bigW">00:00:00</div></div>
            </div>
            <div id="active" class="small muted"></div>
            <div id="msg" class="small error"></div>
          </div>

          <div class="box raceBox">
            <div class="label">Countdown to next race</div>
            <div id="raceCountdownTitle" class="small muted titleReserve" style="margin-bottom:.35rem;"></div>
            <div class="kpi">
              <div class="slot-big"><div id="raceCountdown" class="big nums bigW">00:00:00</div></div>
            </div>
          </div>
        </div>

        <div class="grid2">
          <div class="box box-up-next">
            <div class="label">Up next (tasks)</div>
            <div class="upnext-body">
              <div id="upNextTasks" class="small listBlock muted">Loading…</div>
            </div>
          </div>
          <div class="box raceBox box-up-next">
            <div class="label">Up next (races)</div>
            <div class="upnext-body">
              <div id="upNextRaces" class="small listBlock muted">Loading…</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

<script>
/**
 * CONFIG
 * Google Sheets published CSV URL.
 * - column A: boundary times (HH:MM). Each row starts a block that runs until the next row’s time.
 *   The last time is end-of-window (no separate block after it). Column B is ignored.
 * - column C: name/description for the block that starts at that row’s time
 * Event date: row 21 in column C or D, or any row whose column A is “Date” (value in B, C, or D).
 */
const CSV_URL_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbnxuPH_HDH9RdFUQmau6T_fX-FjygDnR-TNe6YJt5lf8vuG7Ls8TfopG4pTQOEL5b9V0QwKD3kdjM/pub?gid=2132763229&single=true&output=csv";
// Cache-busting per fetch (important: Date.now() must be evaluated each time)
function csvUrl(){
  return `${CSV_URL_BASE}${CSV_URL_BASE.includes("?") ? "&" : "?"}t=${Date.now()}`;
}

const COL_TIME = 0;
const COL_NAME = 2;

// Event date row (1-based row 21 → index 20). Value may be in C or D depending on layout.
const DATE_CELL_ROW = 21 - 1; // 20
const DATE_VALUE_COLS = [2, 3, 1]; // C, D, B — try in that order

// Re-fetch published CSV this often so sheet edits show up quickly (display still updates every 1s)
const SCHEDULE_REFRESH_MS = 1000;

/** @type {{ startSec: number, endSec: number, startMin: number, name: string, timeStr: string }[]} */
let schedule = [];
let windowEndSec = null; // sailing day ends at this second-of-day (local)
let lastFetchMs = 0;
let eventDateKey = null; // YYYY-MM-DD from C21
let loadError = "";
/** Monotonic id so only the latest CSV fetch may commit (avoids out-of-order / stale responses). */
let scheduleFetchGen = 0;
let scheduleFetchAbort = null;

function escapeHtml(s){
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/** One row in Up next: fixed-width time column so times line up; whole block centered in the panel. */
function upNextLineHtml(ev){
  const t = formatHMfromSeconds(ev.startSec);
  const n = escapeHtml(ev.name || "(no label)");
  return `<div class="upnext-line"><span class="upnext-time nums">${t}</span><span class="upnext-sep">—</span><span class="upnext-name">${n}</span></div>`;
}

/** Up next (races): label only, no leading time */
function upNextRaceLineHtml(ev){
  const n = escapeHtml(ev.name || "(no label)");
  return `<div class="upnext-line upnext-line--name-only"><span class="upnext-name">${n}</span></div>`;
}

function pad2(n){ return String(n).padStart(2,"0"); }

function formatHMS(d){
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

function formatHMfromSeconds(sec){
  const m = Math.floor(sec / 60);
  const hh = Math.floor(m / 60) % 24;
  const mm = m % 60;
  return `${pad2(hh)}:${pad2(mm)}`;
}

/** HH:MM:00 — same width as live clock (tabular nums + 9ch slot). */
function formatHMwithFixedSec(sec){
  return `${formatHMfromSeconds(sec)}:00`;
}

function nowSecondsOfDay(d){
  return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
}

/** Always HH:MM:SS so width stays constant (with tabular nums). */
function formatCountdown(deltaSec){
  const hh = Math.floor(deltaSec / 3600);
  const mm = Math.floor((deltaSec % 3600) / 60);
  const ss = deltaSec % 60;
  return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
}

function dateKeyLocal(d){
  // local date as YYYY-MM-DD
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

/** Google/Excel serial whole days since 1899-12-30 (UTC). */
function serialDayToKey(serialInt){
  const n = Math.floor(Number(serialInt));
  if (Number.isNaN(n) || n < 1 || n > 80000) return null;
  const base = Date.UTC(1899, 11, 30);
  const d = new Date(base + n * 86400000);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
}

function parseDateToKey(s){
  if (s === undefined || s === null) return null;
  const raw = String(s).trim();
  if (!raw) return null;

  // ISO: YYYY-MM-DD (recommended)
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;

  // Slash dates: interpret as DD/MM/YYYY (e.g. 10/04/2026 → 10 Apr 2026)
  const dmy = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (dmy){
    const dd = Number(dmy[1]), mm = Number(dmy[2]), yy = Number(dmy[3]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return `${yy}-${pad2(mm)}-${pad2(dd)}`;
  }

  // Sometimes Sheets exports a full datetime; try extracting YYYY-MM-DD
  const isoInText = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (isoInText) return `${isoInText[1]}-${isoInText[2]}-${isoInText[3]}`;

  // Plain serial day number from CSV (no meaningful time fraction)
  const asNum = Number(raw.replace(",", "."));
  if (!Number.isNaN(asNum) && asNum >= 1 && asNum < 80000){
    const day = Math.round(asNum);
    if (Math.abs(asNum - day) < 1e-5){
      const key = serialDayToKey(day);
      if (key) return key;
    }
  }

  return null;
}

function parseEventDateFromRows(rows){
  if (!rows?.length) return null;
  const r = rows[DATE_CELL_ROW];
  if (r){
    for (const c of DATE_VALUE_COLS){
      const key = parseDateToKey(r[c]);
      if (key) return key;
    }
  }
  for (let i = 0; i < rows.length; i++){
    const label = (rows[i][COL_TIME] ?? "").trim().toLowerCase();
    if (label !== "date") continue;
    for (const c of DATE_VALUE_COLS){
      const key = parseDateToKey(rows[i][c]);
      if (key) return key;
    }
  }
  return null;
}

function parseTimeToMinutes(s){
  if (s === undefined || s === null) return null;
  const raw = String(s).trim();
  if (!raw) return null;

  // 12-hour with AM/PM must run before generic H:MM — otherwise "1:25:00 PM" is read as 01:25.
  const ampmFull = raw.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])\b/);
  if (ampmFull){
    let hh = Number(ampmFull[1]);
    const mm = Number(ampmFull[2]);
    const ap = ampmFull[4].toUpperCase();
    if (hh >= 1 && hh <= 12 && mm >= 0 && mm <= 59){
      if (ap === "PM" && hh !== 12) hh += 12;
      if (ap === "AM" && hh === 12) hh = 0;
      return hh * 60 + mm;
    }
  }

  // 24-hour H:MM(:SS) — prefer a match that looks like clock time, not a small decimal
  const timeMatch = raw.match(/(?:^|\s|T)(\d{1,2}):(\d{2})(?::(\d{2}))?(?!\s*[AaPp][Mm])/);
  if (timeMatch) {
    const hh = Number(timeMatch[1]);
    const mm = Number(timeMatch[2]);
    if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59) return hh * 60 + mm;
  }

  const asNum = Number(raw.replace(",", "."));
  if (!Number.isNaN(asNum) && asNum > 0 && asNum < 1){
    const minutes = Math.round((asNum % 1) * 24 * 60);
    return (minutes >= 0 && minutes < 24 * 60) ? minutes : null;
  }
  // Datetime serial: day + fraction (time in day)
  if (!Number.isNaN(asNum) && asNum >= 1 && asNum < 80000){
    const frac = asNum % 1;
    if (frac > 1e-9 && frac < 1 - 1e-9){
      const minutes = Math.round(frac * 24 * 60);
      if (minutes >= 0 && minutes < 24 * 60) return minutes;
    }
  }

  return null;
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");

  const firstLine = text.split(/\r?\n/).find(l => l.trim().length > 0) || "";
  const commaCount = (firstLine.match(/,/g) || []).length;
  const semiCount  = (firstLine.match(/;/g) || []).length;
  const delim = semiCount > commaCount ? ";" : ",";

  const rows = [];
  let row = [], cell = "", inQ = false;

  for (let i=0; i<text.length; i++){
    const c = text[i];
    const n = text[i+1];

    if (inQ){
      if (c === '"' && n === '"'){ cell += '"'; i++; }
      else if (c === '"'){ inQ = false; }
      else { cell += c; }
    } else {
      if (c === '"'){ inQ = true; }
      else if (c === delim){ row.push(cell); cell = ""; }
      else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c === '\r'){ /* ignore */ }
      else { cell += c; }
    }
  }
  row.push(cell);
  rows.push(row);
  return rows;
}

function scheduleSnapshotKey(ev){
  return `${ev.startSec}|${ev.endSec}|${ev.name}|${ev.timeStr}`;
}

function schedulesEqual(a, b){
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++){
    if (scheduleSnapshotKey(a[i]) !== scheduleSnapshotKey(b[i])) return false;
  }
  return true;
}

async function loadSchedule(){
  scheduleFetchGen += 1;
  const gen = scheduleFetchGen;
  if (scheduleFetchAbort){
    try { scheduleFetchAbort.abort(); } catch { /* ignore */ }
  }
  const ac = new AbortController();
  scheduleFetchAbort = ac;
  const signal = ac.signal;

  try{
    const url = csvUrl();
    const res = await fetch(url, { cache: "no-store", signal });
    if (gen !== scheduleFetchGen) return;
    if (!res.ok) throw new Error(`CSV fetch failed: ${res.status} ${res.statusText} (url: ${url})`);

    const txt = await res.text();
    if (gen !== scheduleFetchGen) return;
    const rows = parseCSV(txt);

    const nextEventDateKey = parseEventDateFromRows(rows);
    let nextLoadError = "";
    if (!nextEventDateKey){
      nextLoadError =
        "Could not parse event date (put it in C21 or D21, or a “Date” row with the value in B/C/D). Use YYYY-MM-DD or DD/MM/YYYY.";
    }

    const markers = [];
    for (let r = 0; r < rows.length; r++){
      const timeStr = (rows[r][COL_TIME] ?? "").trim();
      const name = (rows[r][COL_NAME] ?? "").trim();
      const startMin = parseTimeToMinutes(timeStr);
      if (startMin === null) continue;
      markers.push({ startMin, name, timeStr });
    }

    markers.sort((a, b) => a.startMin - b.startMin);

    const merged = [];
    for (const m of markers){
      const prev = merged[merged.length - 1];
      if (prev && prev.startMin === m.startMin){
        if (m.name) prev.name = m.name;
        prev.timeStr = m.timeStr;
      } else {
        merged.push({ startMin: m.startMin, name: m.name, timeStr: m.timeStr });
      }
    }

    if (gen !== scheduleFetchGen) return;

    let nextSchedule;
    let nextWindowEndSec;
    if (merged.length < 2){
      nextSchedule = [];
      nextWindowEndSec = merged.length === 1 ? merged[0].startMin * 60 : null;
    } else {
      const phases = [];
      for (let i = 0; i < merged.length - 1; i++){
        phases.push({
          startSec: merged[i].startMin * 60,
          endSec: merged[i + 1].startMin * 60,
          startMin: merged[i].startMin,
          name: merged[i].name,
          timeStr: merged[i].timeStr,
        });
      }
      nextSchedule = phases;
      nextWindowEndSec = merged[merged.length - 1].startMin * 60;
    }

    if (gen !== scheduleFetchGen) return;

    const sameData =
      nextEventDateKey === eventDateKey &&
      nextLoadError === loadError &&
      nextWindowEndSec === windowEndSec &&
      schedulesEqual(nextSchedule, schedule);

    if (sameData){
      lastFetchMs = Date.now();
      return;
    }

    eventDateKey = nextEventDateKey;
    loadError = nextLoadError;
    schedule = nextSchedule;
    windowEndSec = nextWindowEndSec;
    lastFetchMs = Date.now();
  } catch (e){
    if (e?.name === "AbortError") return;
    if (gen !== scheduleFetchGen) return;
    loadError = "Couldn't load T-Minus sheet";
  }
}

// ---- RACE DETECTION RULE ----
// Count actual race blocks (e.g. "Race 1 (A1)…"), not pit-lane rows like "Pit lane - Race 2…".
function isRace(ev){
  return (ev.name || "").trim().toLowerCase().startsWith("race");
}

/** One entry per start time (sheet sometimes has two rows at the same boundary). */
function dedupeByStartSec(phases){
  const out = [];
  for (const ev of phases){
    if (out.length && out[out.length - 1].startSec === ev.startSec) continue;
    out.push(ev);
  }
  return out;
}

// Next phase start after `now` among matching rows (no wrap to tomorrow)
function secondsUntilNextMatching(now, predicate){
  if (!schedule.length) return null;

  const items = predicate ? schedule.filter(predicate) : schedule.slice();
  if (!items.length) return null;

  const nowSec = nowSecondsOfDay(now);
  const next = items.find(ev => ev.startSec > nowSec);
  if (!next) return null;

  const deltaSec = Math.max(0, next.startSec - nowSec);
  return { next, deltaSec };
}

function isSailingWindowClosed(now){
  if (eventDateKey){
    const todayKey = dateKeyLocal(now);
    if (todayKey !== eventDateKey) return true;
  }

  if (windowEndSec == null && !schedule.length) return false;

  const nowSec = nowSecondsOfDay(now);
  if (windowEndSec == null) return false;
  return nowSec >= windowEndSec;
}

function findActive(now){
  if (!schedule.length) return null;

  const nowSec = nowSecondsOfDay(now);
  if (nowSec < schedule[0].startSec) return null;

  for (const ev of schedule){
    if (nowSec >= ev.startSec && nowSec < ev.endSec) return ev;
  }
  return null;
}

function render(){
  const now = new Date();
  document.getElementById("now").textContent = formatHMS(now);

  document.getElementById("msg").textContent = loadError;

  const closed = isSailingWindowClosed(now);
  if (closed){
    document.getElementById("nextTaskTime").textContent = "";
    document.getElementById("nextTaskName").textContent = "—";
    document.getElementById("nextTaskBox").classList.add("next-task-empty");

    document.getElementById("taskCountdownTitle").textContent = "";
    document.getElementById("taskCountdown").textContent = "--:--:--";
    document.getElementById("active").textContent = "";

    document.getElementById("raceCountdownTitle").textContent = "";
    const raceCd = document.getElementById("raceCountdown");
    raceCd.textContent = "SAILING WINDOW CLOSED";
    raceCd.classList.add("is-closed");

    document.getElementById("upNextTasks").innerHTML = "";
    document.getElementById("upNextRaces").innerHTML = "";

    return;
  }

  // NEXT TASK (any row)
  const nextTaskInfo = secondsUntilNextMatching(now, null);

  if (nextTaskInfo){
    const { next, deltaSec } = nextTaskInfo;
    document.getElementById("nextTaskTime").textContent = formatHMwithFixedSec(next.startSec);
    document.getElementById("nextTaskName").textContent = next.name ? next.name : "—";
    document.getElementById("nextTaskBox").classList.remove("next-task-empty");
    document.getElementById("taskCountdownTitle").textContent = next.name ? next.name : "";
    document.getElementById("taskCountdown").textContent = formatCountdown(deltaSec);
  } else {
    document.getElementById("nextTaskTime").textContent = "";
    document.getElementById("nextTaskName").textContent = "No upcoming tasks";
    document.getElementById("nextTaskBox").classList.add("next-task-empty");
    document.getElementById("taskCountdownTitle").textContent = "";
    document.getElementById("taskCountdown").textContent = "--:--:--";
  }

  // NEXT RACE (race rows only)
  const nextRaceInfo = secondsUntilNextMatching(now, isRace);

  if (nextRaceInfo){
    const { next, deltaSec } = nextRaceInfo;
    document.getElementById("raceCountdownTitle").textContent = next.name ? next.name : "Next race";
    const raceCd = document.getElementById("raceCountdown");
    raceCd.textContent = formatCountdown(deltaSec);
    raceCd.classList.remove("is-closed");
  } else {
    document.getElementById("raceCountdownTitle").textContent = schedule.length ? "No upcoming races" : "";
    const raceCd = document.getElementById("raceCountdown");
    raceCd.textContent = "--:--:--";
    raceCd.classList.remove("is-closed");
  }

  const nowSec = nowSecondsOfDay(now);
  const active = findActive(now);
  if (active?.name){
    const ends = formatHMwithFixedSec(active.endSec);
    document.getElementById("active").textContent = `NOW: ${active.name} · until ${ends}`;
  } else {
    document.getElementById("active").textContent = "";
  }

  // Up next — starts *after* the immediate next item (same as countdown boxes above),
  // so we don’t repeat that row here.
  if (schedule.length){
    const aheadTasks = dedupeByStartSec(
      schedule
        .filter(ev => ev.startSec > nowSec)
        .sort((a, b) => a.startSec - b.startSec)
    );
    const upcomingTaskEvs = aheadTasks.slice(1, 4);

    let tasksHtml;
    if (upcomingTaskEvs.length){
      tasksHtml = `<div class="listBlock-inner">${upcomingTaskEvs.map(ev => upNextLineHtml(ev)).join("")}</div>`;
    } else if (!aheadTasks.length){
      tasksHtml = "<div class=\"upnext-msg\">No upcoming tasks</div>";
    } else {
      tasksHtml = "<div class=\"upnext-msg muted\">No more tasks</div>";
    }
    document.getElementById("upNextTasks").innerHTML = tasksHtml;

    const aheadRaces = dedupeByStartSec(
      schedule
        .filter(isRace)
        .filter(ev => ev.startSec > nowSec)
        .sort((a, b) => a.startSec - b.startSec)
    );
    const upcomingRaceEvs = aheadRaces.slice(1, 4);

    let racesHtml;
    if (upcomingRaceEvs.length){
      racesHtml = `<div class="listBlock-inner">${upcomingRaceEvs.map(ev => upNextRaceLineHtml(ev)).join("")}</div>`;
    } else if (!aheadRaces.length){
      racesHtml = "<div class=\"upnext-msg\">No upcoming races</div>";
    } else {
      racesHtml = "<div class=\"upnext-msg muted\">No more races</div>";
    }
    document.getElementById("upNextRaces").innerHTML = racesHtml;
  } else {
    document.getElementById("upNextTasks").textContent = "";
    document.getElementById("upNextRaces").textContent = "";
  }
}

async function tick(){
  const nowMs = Date.now();
  if (!lastFetchMs || (nowMs - lastFetchMs) > SCHEDULE_REFRESH_MS){
    await loadSchedule();
  }
  render();
}

(async function init(){
  if (!CSV_URL_BASE){
    document.getElementById("msg").textContent = "CSV_URL_BASE is empty.";
  } else {
    await loadSchedule();
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
