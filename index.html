<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Race Clock</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --surface-glass: rgba(75, 85, 98, 0.055);
      --surface-glass-deep: rgba(75, 85, 98, 0.095);
      /* #002164 — rgb(0, 33, 100), tinted glass over white */
      --race-glass: rgba(0, 33, 100, 0.1);
      --race-glass-deep: rgba(0, 33, 100, 0.17);
      --text: #141820;
      --text-muted: #3d4752;
      --digits: #0a0a0a;
      --race-text: #0a1730;
      --race-muted: rgba(0, 33, 100, 0.62);
      --race-digits: #002164;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-page);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .wrap {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: clamp(0.5rem, 1.8vmin, 1.25rem) clamp(0.5rem, 2.5vw, 1.5rem);
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: clamp(0.65rem, 2.2vmin, 1.35rem);
      flex: 1 1 auto;
      min-height: 0;
      box-sizing: border-box;
    }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(0.15rem, 1vmin, 0.5rem) 0;
      flex: 0 0 auto;
    }
    .brand-logo {
      width: min(92%, 720px);
      height: auto;
      max-height: clamp(36px, min(11vw, 12vh), 96px);
      object-fit: contain;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(0.65rem, 2.2vmin, 1.1rem);
      width: 100%;
      justify-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
    }
    .label {
      letter-spacing: 0.14em;
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-align: center;
    }
    .raceBox .label { color: rgba(0, 33, 100, 0.72); }
    .big {
      font-weight: 800;
      font-size: clamp(36px, min(9vw, 11vh), 128px);
      line-height: 1;
      color: var(--digits);
    }
    .mid {
      font-weight: 800;
      font-size: clamp(22px, min(5vw, 6vh), 72px);
      line-height: 1.08;
      color: var(--digits);
    }
    .small { font-size: clamp(14px, min(2.2vw, 2.8vh), 26px); color: var(--text); }
    .muted { color: var(--text-muted); }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(0.65rem, 2.2vmin, 1.1rem);
      width: 100%;
      align-items: stretch;
    }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    /* Top row: equal column heights; time rows share space; task name footer on the right */
    .pair-row { align-items: stretch; }
    .pair-row > .box {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .pair-row .box-current-time > .slot-mid {
      flex: 1 1 auto;
    }
    .box-next-task > .next-task-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
    }
    .box-next-task .next-task-body .slot-mid {
      flex: 0 0 auto;
    }
    .box-next-task.next-task-empty .next-task-body .slot-mid {
      display: none;
    }
    .box {
      padding: clamp(0.65rem, 2.2vmin, 1.5rem) clamp(0.75rem, 2.5vw, 1.75rem);
      border-radius: clamp(10px, 1.2vmin, 14px);
      background: linear-gradient(180deg, var(--surface-glass) 0%, var(--surface-glass-deep) 100%);
      border: none;
      box-shadow: 0 1px 3px rgba(15, 25, 40, 0.04);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      box-sizing: border-box;
      min-width: 0;
    }
    .box.raceBox {
      background: linear-gradient(165deg, var(--race-glass) 0%, var(--race-glass-deep) 100%);
      border: none;
      box-shadow: 0 1px 4px rgba(0, 33, 100, 0.06);
    }
    .raceBox .big,
    .raceBox .mid { color: var(--race-digits); }
    .raceBox .small { color: var(--race-text); }
    .raceBox .muted { color: var(--race-muted); }
    .error { color: #b71c1c; font-weight: 700; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(0.65rem, 2.2vmin, 1.1rem);
      width: 100%;
      align-items: stretch;
    }
    @media (max-width: 920px) { .split { grid-template-columns: 1fr; } }
    .kpi {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      width: 100%;
    }
    .nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .slot-mid {
      min-height: calc(1.15 * clamp(26px, min(4.5vw, 5.5vh), 64px));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot-big {
      min-height: clamp(44px, min(8vw, 10vh), 120px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .raceBox .slot-big {
      height: clamp(44px, min(8vw, 10vh), 120px);
      box-sizing: border-box;
    }
    .race-countdown-title {
      flex: 0 0 auto;
      width: 100%;
      text-align: center;
      margin: 0 0 0.2rem;
      min-height: 0;
    }
    .race-countdown-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }
    .race-countdown-body .kpi {
      flex: 0 0 auto;
      width: 100%;
    }
    #raceCountdown.is-closed {
      font-size: clamp(15px, 2.65vw, 26px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      color: var(--race-digits);
      white-space: normal;
      text-align: center;
      max-width: 26ch;
      min-width: 0 !important;
      margin-inline: auto;
    }
    .nums.midW { min-width: 8ch; display: inline-block; text-align: center; }
    .nums.bigW { min-width: 8ch; display: inline-block; text-align: center; }
    .box-current-time .slot-mid {
      justify-content: center;
      align-items: center;
    }
    .listBlock {
      min-height: 4em;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .box-up-next {
      min-height: 0;
    }
    .box-up-next .upnext-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      min-height: 5.5em;
    }
    .box-up-next .upnext-body .listBlock {
      min-height: 0;
      justify-content: center;
    }
    /* One column, left-aligned text; whole column centered in the box so times line up */
    .listBlock-inner {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35em;
      width: max-content;
      max-width: 100%;
      margin-inline: auto;
      text-align: left;
    }
    .listBlock > .upnext-msg {
      width: 100%;
      text-align: center;
    }
    .upnext-line {
      display: grid;
      grid-template-columns: 5.25ch auto minmax(0, 1fr);
      gap: 0 0.45em;
      align-items: baseline;
      justify-items: start;
      width: 100%;
      min-width: 0;
      text-align: left;
    }
    .upnext-time {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      text-align: right;
      justify-self: end;
    }
    .upnext-sep {
      opacity: 0.65;
      justify-self: center;
    }
    .upnext-name {
      min-width: 0;
      word-break: break-word;
    }
    .upnext-line--name-only {
      display: block;
      width: 100%;
      text-align: left;
    }
    .upnext-line--name-only .upnext-name {
      display: block;
    }
    .titleReserve {
      min-height: 2.35em;
      width: 100%;
      text-align: center;
    }
    #raceCountdownTitle {
      text-align: center;
    }
    #nextTaskName {
      width: 100%;
      text-align: center;
    }
    .box-task-timers {
      min-height: 0;
    }
    .task-timers-scroll {
      display: flex;
      flex-direction: column;
      gap: clamp(0.35rem, 1.2vmin, 0.5rem);
      width: 100%;
      max-height: min(52vh, 440px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.15rem 0;
      -webkit-overflow-scrolling: touch;
    }
    .task-timer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem 0.75rem;
      align-items: center;
      padding: clamp(0.45rem, 1.4vmin, 0.65rem) clamp(0.5rem, 1.8vmin, 0.85rem);
      border-radius: clamp(8px, 1vmin, 11px);
      background: rgba(75, 85, 98, 0.07);
      text-align: left;
      box-sizing: border-box;
      min-width: 0;
    }
    .task-timer-row.is-active {
      background: rgba(75, 85, 98, 0.2);
    }
    .task-timer-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.12em;
      align-items: flex-start;
    }
    .task-timer-start {
      font-size: clamp(12px, min(1.6vw, 1.9vh), 15px);
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .task-timer-name {
      font-size: clamp(13px, min(1.85vw, 2.2vh), 18px);
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      word-break: break-word;
    }
    .task-timer-nums {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      font-weight: 800;
      font-size: clamp(20px, min(4.2vw, 5vh), 40px);
      line-height: 1;
      color: var(--digits);
      flex-shrink: 0;
      align-self: center;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .task-timer-hm {
      text-align: right;
      min-width: 5.5ch;
    }
    .task-timer-ss {
      min-width: 3ch;
      text-align: left;
    }
    .task-timer-ss--blank {
      visibility: hidden;
    }
    .task-timer-ended {
      color: var(--text-muted);
      font-weight: 600;
      min-width: 5.5ch;
      text-align: center;
    }
    /* Active row when the live countdown is shown on the next task row instead (see buildTaskTimersHtml). */
    .task-timer-nums--pending {
      min-width: 9ch;
      display: inline-block;
      text-align: center;
      vertical-align: middle;
    }
    .task-timer-nums--pending::after {
      content: "\2014";
      color: var(--text-muted);
      font-weight: 600;
    }
    .task-timers-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: clamp(13px, min(2vw, 2.4vh), 18px);
      padding: 0.75rem 0;
    }
    #msg {
      width: 100%;
      text-align: center;
      margin-top: clamp(0.65rem, 2.2vmin, 1.25rem);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header class="brand">
        <img class="brand-logo" src="ger-sailgp-logo.png" width="360" height="80" alt="Germany SailGP Team" />
      </header>
      <div class="row">
        <div class="grid2 pair-row">
          <div class="box box-current-time">
            <div class="label" id="currentTimeLabel">Current time</div>
            <div class="slot-mid"><div id="now" class="mid nums midW">00:00:00</div></div>
          </div>

          <div class="box box-next-task" id="nextTaskBox">
            <div class="label">Next task time</div>
            <div class="next-task-body">
              <div class="slot-mid"><div id="nextTaskTime" class="mid nums midW">00:00</div></div>
              <div id="nextTaskName" class="small muted next-task-meta">—</div>
            </div>
          </div>
        </div>

        <div class="split">
          <div class="box box-task-timers">
            <div class="label">Task countdowns</div>
            <div id="taskTimersList" class="task-timers-scroll" aria-live="polite"></div>
            <div id="msg" class="small error"></div>
          </div>

          <div class="box raceBox">
            <div class="label">Countdown to next race</div>
            <div id="raceCountdownTitle" class="small muted race-countdown-title"></div>
            <div class="race-countdown-body">
              <div class="kpi">
                <div class="slot-big"><div id="raceCountdown" class="big nums bigW">00:00:00</div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="box raceBox box-up-next">
          <div class="label">Up next (races)</div>
          <div class="upnext-body">
            <div id="upNextRaces" class="small listBlock muted">Loading…</div>
          </div>
        </div>

      </div>
    </div>
  </div>

<script>
/**
 * CONFIG
 * Google Sheets published CSV URL.
 * - column H: boundary times (HH:MM). Each row starts a block that runs until the next row’s time.
 *   The last time is end-of-window (no separate block after it).
 * - column I: name/description for the block that starts at that row’s time
 * Schedule markers: only from sheet row 24 downward (rows above are ignored for T-minus phases).
 * Event date: sheet row 23, column H (value next to “Date” in G23 for this tab).
 * Venue timezone: N23 (e.g. America/New_York). First race: M24 (date), N24 (time).
 * On Friday (venue TZ) before first race: “First Race” countdown to M24/N24; next task + task list use Friday (venue today).
 * Sat/Sun: normal same-day schedule logic.
 * Published CSV: gid=571089878. Schedule times in H/I from row 24 downward.
 */
const CSV_URL_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbnxuPH_HDH9RdFUQmau6T_fX-FjygDnR-TNe6YJt5lf8vuG7Ls8TfopG4pTQOEL5b9V0QwKD3kdjM/pub?gid=571089878&single=true&output=csv";
const DEFAULT_SCHEDULE_TZ = "America/New_York";
// Cache-busting per fetch (important: Date.now() must be evaluated each time)
function csvUrl(){
  return `${CSV_URL_BASE}${CSV_URL_BASE.includes("?") ? "&" : "?"}t=${Date.now()}`;
}

const COL_TIME = 7; // H
const COL_NAME = 8; // I

// Event date cell (H23).
const DATE_CELL_ROW = 23 - 1; // 22
const DATE_VALUE_COLS = [7]; // H

// Venue IANA timezone — N23 (primary).
const VENUE_CELL_ROW = 23 - 1; // 22
const COL_VENUE = 13; // N
// Legacy / fallback timezone cells.
const TIMEZONE_CELL_ROW = 22 - 1;
const TIMEZONE_VALUE_COLS = [7, 8, 6];

// First race (Friday preview): M24 date, N24 time (venue TZ).
const FIRST_RACE_CFG_ROW = 24 - 1; // 23
const COL_FIRST_RACE_DATE = 12; // M
const COL_FIRST_RACE_TIME = 13; // N

// Schedule times/names: only read from this row onward (1-based sheet row 24 → index 23).
const SCHEDULE_FIRST_ROW_INDEX = 24 - 1;

// Re-fetch published CSV this often (clock still updates every 1s).
const SCHEDULE_REFRESH_MS = 4000;
/** @type {{ startSec: number, endSec: number, startMin: number, name: string, timeStr: string }[]} */
let schedule = [];
let windowEndSec = null; // sailing day ends at this second-of-day (venue TZ)
let lastFetchMs = 0;
let eventDateKey = null; // YYYY-MM-DD from H23
/** IANA timezone from sheet (N23 / “Timezone” label); fallback DEFAULT_SCHEDULE_TZ. */
let scheduleTz = DEFAULT_SCHEDULE_TZ;
/** First race instant (ms) from M24+N24; null if not set. */
let firstRaceInstantMs = null;
let firstRaceDateKey = null;
let firstRaceMinOfDay = null;
let loadError = "";
/** One fetch at a time — avoids overlapping requests returning in random order from Google’s cache. */
let scheduleLoadPromise = null;
/** Normalized CSV last applied to `schedule`. */
let lastCommittedCsvText = "";
/** Rebuild task list DOM only when row states change; keeps scroll position between ticks. */
let lastTaskListStructureKey = "";
let lastAutoScrollFocusStartSec = null;
let taskListUserInteractedAt = 0;
function escapeHtml(s){
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/** Up next (races): label only, no leading time */
function upNextRaceLineHtml(ev){
  const n = escapeHtml(ev.name || "(no label)");
  return `<div class="upnext-line upnext-line--name-only"><span class="upnext-name">${n}</span></div>`;
}

function pad2(n){ return String(n).padStart(2,"0"); }

const TZ_ALIASES = {
  "new york": "America/New_York",
  "ny": "America/New_York",
  "nyc": "America/New_York",
  "los angeles": "America/Los_Angeles",
  "la": "America/Los_Angeles",
  "san francisco": "America/Los_Angeles",
  "london": "Europe/London",
  "uk": "Europe/London",
  "cet": "Europe/Berlin",
  "berlin": "Europe/Berlin",
  "paris": "Europe/Paris",
  "sydney": "Australia/Sydney",
  "auckland": "Pacific/Auckland",
  "dubai": "Asia/Dubai",
  "singapore": "Asia/Singapore",
};

function isValidTimeZone(tz){
  try{
    new Intl.DateTimeFormat("en-US", { timeZone: tz }).format(new Date());
    return true;
  } catch {
    return false;
  }
}

function normalizeTimeZoneInput(raw){
  const s = String(raw ?? "").trim();
  if (!s) return null;
  const lower = s.toLowerCase();
  if (TZ_ALIASES[lower]) return TZ_ALIASES[lower];
  if (/^[A-Za-z]+\/[A-Za-z0-9_+-]+(?:\/[A-Za-z0-9_+-]+)?$/.test(s)) return s;
  return null;
}

function resolveTimeZone(raw){
  const candidate = normalizeTimeZoneInput(raw);
  if (!candidate || !isValidTimeZone(candidate)) return null;
  return candidate;
}

function cellInRow(row, col){
  if (!row || col < 0 || col >= row.length) return "";
  return String(row[col] ?? "").trim();
}

function parseTimeZoneFromRows(rows){
  if (!rows?.length) return { tz: DEFAULT_SCHEDULE_TZ, warning: "" };

  const venueRow = rows[VENUE_CELL_ROW];
  if (venueRow){
    const tz = resolveTimeZone(cellInRow(venueRow, COL_VENUE));
    if (tz) return { tz, warning: "" };
  }

  const fixed = rows[TIMEZONE_CELL_ROW];
  if (fixed){
    for (const c of TIMEZONE_VALUE_COLS){
      const tz = resolveTimeZone(cellInRow(fixed, c));
      if (tz) return { tz, warning: "" };
    }
  }

  for (let i = 0; i < rows.length; i++){
    const row = rows[i];
    for (let j = 0; j < row.length; j++){
      const label = cellInRow(row, j).toLowerCase();
      if (label !== "timezone" && label !== "time zone" && label !== "location") continue;
      const tryCols = [j + 1, j + 2, 7, 8, 6];
      const seen = new Set();
      for (const c of tryCols){
        if (seen.has(c)) continue;
        seen.add(c);
        const tz = resolveTimeZone(cellInRow(row, c));
        if (tz) return { tz, warning: "" };
      }
    }
  }

  let hadInvalid = false;
  if (fixed){
    for (const c of TIMEZONE_VALUE_COLS){
      if (cellInRow(fixed, c)) hadInvalid = true;
    }
  }
  const hadInvalidVenue = venueRow && cellInRow(venueRow, COL_VENUE);
  const warning = (hadInvalid || hadInvalidVenue)
    ? `Invalid timezone in N23 (e.g. America/New_York). Using ${DEFAULT_SCHEDULE_TZ}.`
    : "";
  return { tz: DEFAULT_SCHEDULE_TZ, warning };
}

function getScheduleTzPartsFromMs(ms, tz = scheduleTz){
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: tz,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
  });
  const parts = fmt.formatToParts(new Date(ms));
  const num = t => Number(parts.find(p => p.type === t)?.value ?? 0);
  let hour = num("hour");
  if (hour === 24) hour = 0;
  return {
    year: num("year"),
    month: num("month"),
    day: num("day"),
    hour,
    minute: num("minute"),
    second: num("second"),
  };
}

function dateKeyFromTzParts(p){
  return `${p.year}-${pad2(p.month)}-${pad2(p.day)}`;
}

function dateKeyToUtcDayStart(dateKey){
  const [y, m, d] = dateKey.split("-").map(Number);
  return Date.UTC(y, m - 1, d);
}

/** Wall-clock on `dateKey` at minutes-from-midnight in `tz` → UTC ms. */
function zonedWallClockToMs(dateKey, minOfDay, tz = scheduleTz){
  const [yy, mo, dd] = dateKey.split("-").map(Number);
  const targetH = Math.floor(minOfDay / 60);
  const targetM = minOfDay % 60;
  let utc = Date.UTC(yy, mo - 1, dd, targetH, targetM, 0);
  for (let i = 0; i < 6; i++){
    const p = getScheduleTzPartsFromMs(utc, tz);
    const curKey = dateKeyFromTzParts(p);
    const curMin = p.hour * 60 + p.minute;
    if (curKey === dateKey && curMin === minOfDay) return utc;
    const dayDiff = Math.round((dateKeyToUtcDayStart(dateKey) - dateKeyToUtcDayStart(curKey)) / 86400000);
    const minDiff = dayDiff * 1440 + (minOfDay - curMin);
    utc += minDiff * 60 * 1000;
  }
  return utc;
}

function parseFirstRaceFromRows(rows, tz = scheduleTz){
  const row = rows[FIRST_RACE_CFG_ROW];
  if (!row) return { ms: null, dateKey: null, minOfDay: null };
  const dateKey = parseDateToKey(cellInRow(row, COL_FIRST_RACE_DATE));
  const minOfDay = parseTimeToMinutes(cellInRow(row, COL_FIRST_RACE_TIME));
  if (!dateKey || minOfDay === null) return { ms: null, dateKey, minOfDay };
  const ms = zonedWallClockToMs(dateKey, minOfDay, tz);
  return { ms, dateKey, minOfDay };
}

/** Wall-clock parts for an instant in the venue timezone (N23 / scheduleTz). */
function getScheduleTzPartsFull(d = new Date(), tz = scheduleTz){
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: tz,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
  });
  const parts = fmt.formatToParts(d);
  const num = t => Number(parts.find(p => p.type === t)?.value ?? 0);
  let hour = num("hour");
  if (hour === 24) hour = 0;
  return {
    year: num("year"),
    month: num("month"),
    day: num("day"),
    hour,
    minute: num("minute"),
    second: num("second"),
  };
}

/** “Now” for all schedule logic — always venue TZ, never the browser’s local zone. */
function scheduleNowContext(d = new Date()){
  const p = getScheduleTzPartsFull(d);
  const nowSec = p.hour * 3600 + p.minute * 60 + p.second;
  const dateKey = dateKeyFromTzParts(p);
  const weekdayShort = new Intl.DateTimeFormat("en-US", {
    timeZone: scheduleTz,
    weekday: "short",
  }).format(d);
  return {
    now: d,
    nowMs: d.getTime(),
    nowSec,
    dateKey,
    weekdayShort,
    isFriday: weekdayShort === "Fri",
  };
}

function isFridayInScheduleTz(d = new Date()){
  return scheduleNowContext(d).isFriday;
}

/** Friday (venue TZ) before first race — preview schedule + countdown to M24/N24. */
function isFridayPreFirstRaceMode(now = new Date()){
  if (firstRaceInstantMs == null) return false;
  const ctx = scheduleNowContext(now);
  if (!ctx.isFriday) return false;
  return ctx.nowMs < firstRaceInstantMs;
}

function scheduleTzShortLabel(tz = scheduleTz){
  try{
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      timeZoneName: "short",
    }).formatToParts(new Date());
    const name = parts.find(p => p.type === "timeZoneName")?.value;
    if (name) return name;
  } catch { /* fall through */ }
  const seg = tz.split("/").pop() || tz;
  return seg.replace(/_/g, " ");
}

function getScheduleTzParts(d = new Date()){
  const p = getScheduleTzPartsFull(d);
  return { hour: p.hour, minute: p.minute, second: p.second };
}

function formatHMS(d){
  const { hour, minute, second } = getScheduleTzParts(d);
  return `${pad2(hour)}:${pad2(minute)}:${pad2(second)}`;
}

function formatHMfromSeconds(sec){
  const m = Math.floor(sec / 60);
  const hh = Math.floor(m / 60) % 24;
  const mm = m % 60;
  return `${pad2(hh)}:${pad2(mm)}`;
}

/** HH:MM:00 — same width as live clock (tabular nums + 9ch slot). */
function formatHMwithFixedSec(sec){
  return `${formatHMfromSeconds(sec)}:00`;
}

function nowSecondsOfDay(d){
  const { hour, minute, second } = getScheduleTzParts(d);
  return hour * 3600 + minute * 60 + second;
}

/** Always HH:MM:SS so width stays constant (with tabular nums). */
function formatCountdown(deltaSec){
  const hh = Math.floor(deltaSec / 3600);
  const mm = Math.floor((deltaSec % 3600) / 60);
  const ss = deltaSec % 60;
  return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
}

function taskCountdownEndedHtml(){
  return taskCountdownHtml(0, false);
}

function taskCountdownHtml(deltaSec, showSeconds){
  const total = Math.max(0, Math.floor(deltaSec));
  const hh = Math.floor(total / 3600);
  const mm = Math.floor((total % 3600) / 60);
  const ss = total % 60;
  const hm = `${pad2(hh)}:${pad2(mm)}`;
  if (showSeconds){
    return `<span class="task-timer-hm">${hm}</span><span class="task-timer-ss">:${pad2(ss)}</span>`;
  }
  return `<span class="task-timer-hm">${hm}</span><span class="task-timer-ss task-timer-ss--blank" aria-hidden="true">:00</span>`;
}

/** Multi-day countdown for Friday → first race (e.g. 1d2h20m). */
function formatCountdownToFirstRace(deltaSec){
  if (deltaSec <= 0) return "00:00:00";
  const d = Math.floor(deltaSec / 86400);
  let rem = deltaSec % 86400;
  const h = Math.floor(rem / 3600);
  rem %= 3600;
  const m = Math.floor(rem / 60);
  if (d > 0) return `${d}d${h}h${m}m`;
  return formatCountdown(deltaSec);
}

function dateKeyLocal(d){
  return dateKeyFromTzParts(getScheduleTzPartsFull(d));
}

/** Google/Excel serial whole days since 1899-12-30 (UTC). */
function serialDayToKey(serialInt){
  const n = Math.floor(Number(serialInt));
  if (Number.isNaN(n) || n < 1 || n > 80000) return null;
  const base = Date.UTC(1899, 11, 30);
  const d = new Date(base + n * 86400000);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
}

function parseDateToKey(s){
  if (s === undefined || s === null) return null;
  const raw = String(s).trim();
  if (!raw) return null;

  // ISO: YYYY-MM-DD (recommended)
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;

  // Slash dates: interpret as DD/MM/YYYY (e.g. 10/04/2026 → 10 Apr 2026)
  const dmy = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (dmy){
    const dd = Number(dmy[1]), mm = Number(dmy[2]), yy = Number(dmy[3]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return `${yy}-${pad2(mm)}-${pad2(dd)}`;
  }

  // Sometimes Sheets exports a full datetime; try extracting YYYY-MM-DD
  const isoInText = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (isoInText) return `${isoInText[1]}-${isoInText[2]}-${isoInText[3]}`;

  // Plain serial day number from CSV (no meaningful time fraction)
  const asNum = Number(raw.replace(",", "."));
  if (!Number.isNaN(asNum) && asNum >= 1 && asNum < 80000){
    const day = Math.round(asNum);
    if (Math.abs(asNum - day) < 1e-5){
      const key = serialDayToKey(day);
      if (key) return key;
    }
  }

  return null;
}

function parseEventDateFromRows(rows){
  if (!rows?.length) return null;
  const r = rows[DATE_CELL_ROW];
  if (r){
    for (const c of DATE_VALUE_COLS){
      const key = parseDateToKey(r[c]);
      if (key) return key;
    }
  }
  return null;
}

function parseTimeToMinutes(s){
  if (s === undefined || s === null) return null;
  const raw = String(s).trim();
  if (!raw) return null;

  // 12-hour with AM/PM must run before generic H:MM — otherwise "1:25:00 PM" is read as 01:25.
  const ampmFull = raw.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])\b/);
  if (ampmFull){
    let hh = Number(ampmFull[1]);
    const mm = Number(ampmFull[2]);
    const ap = ampmFull[4].toUpperCase();
    if (hh >= 1 && hh <= 12 && mm >= 0 && mm <= 59){
      if (ap === "PM" && hh !== 12) hh += 12;
      if (ap === "AM" && hh === 12) hh = 0;
      return hh * 60 + mm;
    }
  }

  // 24-hour H:MM(:SS) — prefer a match that looks like clock time, not a small decimal
  const timeMatch = raw.match(/(?:^|\s|T)(\d{1,2}):(\d{2})(?::(\d{2}))?(?!\s*[AaPp][Mm])/);
  if (timeMatch) {
    const hh = Number(timeMatch[1]);
    const mm = Number(timeMatch[2]);
    if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59) return hh * 60 + mm;
  }

  const asNum = Number(raw.replace(",", "."));
  if (!Number.isNaN(asNum) && asNum > 0 && asNum < 1){
    const minutes = Math.round((asNum % 1) * 24 * 60);
    return (minutes >= 0 && minutes < 24 * 60) ? minutes : null;
  }
  // Datetime serial: day + fraction (time in day)
  if (!Number.isNaN(asNum) && asNum >= 1 && asNum < 80000){
    const frac = asNum % 1;
    if (frac > 1e-9 && frac < 1 - 1e-9){
      const minutes = Math.round(frac * 24 * 60);
      if (minutes >= 0 && minutes < 24 * 60) return minutes;
    }
  }

  return null;
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");

  const firstLine = text.split(/\r?\n/).find(l => l.trim().length > 0) || "";
  const commaCount = (firstLine.match(/,/g) || []).length;
  const semiCount  = (firstLine.match(/;/g) || []).length;
  const delim = semiCount > commaCount ? ";" : ",";

  const rows = [];
  let row = [], cell = "", inQ = false;

  for (let i=0; i<text.length; i++){
    const c = text[i];
    const n = text[i+1];

    if (inQ){
      if (c === '"' && n === '"'){ cell += '"'; i++; }
      else if (c === '"'){ inQ = false; }
      else { cell += c; }
    } else {
      if (c === '"'){ inQ = true; }
      else if (c === delim){ row.push(cell); cell = ""; }
      else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c === '\r'){ /* ignore */ }
      else { cell += c; }
    }
  }
  row.push(cell);
  rows.push(row);
  return rows;
}

function scheduleSnapshotKey(ev){
  return `${ev.startSec}|${ev.endSec}|${ev.name}|${ev.timeStr}`;
}

function schedulesEqual(a, b){
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++){
    if (scheduleSnapshotKey(a[i]) !== scheduleSnapshotKey(b[i])) return false;
  }
  return true;
}

/** Stable string for comparing published CSV bodies (line endings differ between responses). */
function normalizeCsvBody(s){
  return String(s).replace(/\r\n/g, "\n").replace(/\r/g, "\n").trimEnd();
}

async function loadSchedule(){
  if (scheduleLoadPromise) return scheduleLoadPromise;

  scheduleLoadPromise = (async () => {
  try{
    const url = csvUrl();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`CSV fetch failed: ${res.status} ${res.statusText} (url: ${url})`);

    const txt = await res.text();
    const normTxt = normalizeCsvBody(txt);
    if (normTxt === lastCommittedCsvText){
      lastFetchMs = Date.now();
      return;
    }

    const rows = parseCSV(txt);

    const tzResult = parseTimeZoneFromRows(rows);
    const nextScheduleTz = tzResult.tz;

    const nextEventDateKey = parseEventDateFromRows(rows);
    let nextLoadError = tzResult.warning;
    if (!nextEventDateKey){
      const dateErr =
        "Could not parse event date from H23. Use YYYY-MM-DD or DD/MM/YYYY.";
      nextLoadError = nextLoadError ? `${nextLoadError} ${dateErr}` : dateErr;
    }

    const markers = [];
    for (let r = SCHEDULE_FIRST_ROW_INDEX; r < rows.length; r++){
      const timeStr = (rows[r][COL_TIME] ?? "").trim();
      const name = (rows[r][COL_NAME] ?? "").trim();
      const startMin = parseTimeToMinutes(timeStr);
      if (startMin === null) continue;
      markers.push({ startMin, name, timeStr });
    }

    markers.sort((a, b) => a.startMin - b.startMin);

    const merged = [];
    for (const m of markers){
      const prev = merged[merged.length - 1];
      if (prev && prev.startMin === m.startMin){
        if (m.name) prev.name = m.name;
        prev.timeStr = m.timeStr;
      } else {
        merged.push({ startMin: m.startMin, name: m.name, timeStr: m.timeStr });
      }
    }

    let nextSchedule;
    let nextWindowEndSec;
    if (merged.length < 2){
      nextSchedule = [];
      nextWindowEndSec = merged.length === 1 ? merged[0].startMin * 60 : null;
    } else {
      const phases = [];
      for (let i = 0; i < merged.length - 1; i++){
        phases.push({
          startSec: merged[i].startMin * 60,
          endSec: merged[i + 1].startMin * 60,
          startMin: merged[i].startMin,
          name: merged[i].name,
          timeStr: merged[i].timeStr,
        });
      }
      nextSchedule = phases;
      nextWindowEndSec = merged[merged.length - 1].startMin * 60;
    }

    const nextFirstRace = parseFirstRaceFromRows(rows, nextScheduleTz);

    const sameData =
      nextEventDateKey === eventDateKey &&
      nextScheduleTz === scheduleTz &&
      nextFirstRace.ms === firstRaceInstantMs &&
      nextLoadError === loadError &&
      nextWindowEndSec === windowEndSec &&
      schedulesEqual(nextSchedule, schedule);

    if (sameData){
      lastCommittedCsvText = normTxt;
      lastFetchMs = Date.now();
      return;
    }

    scheduleTz = nextScheduleTz;
    eventDateKey = nextEventDateKey;
    loadError = nextLoadError;
    schedule = nextSchedule;
    windowEndSec = nextWindowEndSec;
    firstRaceInstantMs = nextFirstRace.ms;
    firstRaceDateKey = nextFirstRace.dateKey;
    firstRaceMinOfDay = nextFirstRace.minOfDay;
    lastCommittedCsvText = normTxt;
    lastFetchMs = Date.now();
  } catch (e){
    loadError = "Couldn't load T-Minus sheet";
  }
  })();

  try {
    await scheduleLoadPromise;
  } finally {
    scheduleLoadPromise = null;
  }
}

// ---- RACE DETECTION RULE ----
// Count actual race blocks (e.g. "Race 1 (A1)…"), not pit-lane rows like "Pit lane - Race 2…".
function isRace(ev){
  return (ev.name || "").trim().toLowerCase().startsWith("race");
}

/**
 * One logical race can span multiple sheet boundaries (e.g. "Race 1 — line up" then "Race 1 (A1)").
 * Keep the earliest phase per /^race\s*(\d+)/i so "Up next (races)" does not repeat the same race.
 * Names without a race number dedupe by full label (case-insensitive).
 */
function dedupeRacePhasesByLogicalRace(phases){
  const seenNums = new Set();
  const seenLabels = new Set();
  const out = [];
  for (const ev of phases){
    const raw = (ev.name || "").trim();
    const numMatch = raw.match(/^race\s*(\d+)/i);
    if (numMatch){
      const n = numMatch[1];
      if (seenNums.has(n)) continue;
      seenNums.add(n);
    } else {
      const k = raw.toLowerCase();
      if (!k){
        out.push(ev);
        continue;
      }
      if (seenLabels.has(k)) continue;
      seenLabels.add(k);
    }
    out.push(ev);
  }
  return out;
}

function raceChainAfterNowSec(nowSec){
  return dedupeRacePhasesByLogicalRace(chainAfterNowSec(nowSec, isRace));
}

/** One entry per start time (sheet sometimes has two rows at the same boundary). */
function dedupeByStartSec(phases){
  const out = [];
  for (const ev of phases){
    if (out.length && out[out.length - 1].startSec === ev.startSec) continue;
    out.push(ev);
  }
  return out;
}

/** Phases with start after `nowSec`, time-sorted and deduped — same basis for “Next task time” hero. */
function chainAfterNowSec(nowSec, predicate){
  if (!schedule.length) return [];
  const base = predicate ? schedule.filter(predicate) : schedule.slice();
  return dedupeByStartSec(
    base.filter(ev => ev.startSec > nowSec).sort((a, b) => a.startSec - b.startSec)
  );
}

function isSailingWindowClosed(now){
  if (isFridayPreFirstRaceMode(now)) return false;

  if (eventDateKey){
    const todayKey = dateKeyLocal(now);
    if (todayKey !== eventDateKey) return true;
  }

  if (windowEndSec == null && !schedule.length) return false;

  const nowSec = nowSecondsOfDay(now);
  if (windowEndSec == null) return false;
  return nowSec >= windowEndSec;
}

function findActive(now){
  if (!schedule.length) return null;

  const nowSec = nowSecondsOfDay(now);
  if (nowSec < schedule[0].startSec) return null;

  for (const ev of schedule){
    if (nowSec >= ev.startSec && nowSec < ev.endSec) return ev;
  }
  return null;
}

function getTaskPhaseByTime(ev, ctx){
  const { nowSec, nowMs, dayKey } = ctx;
  if (dayKey){
    const startMs = zonedWallClockToMs(dayKey, ev.startMin, scheduleTz);
    const endMs = zonedWallClockToMs(dayKey, Math.floor(ev.endSec / 60), scheduleTz);
    if (nowMs >= endMs) return "ended";
    if (nowMs < startMs) return "future";
    return "active";
  }
  if (nowSec >= ev.endSec) return "ended";
  if (nowSec < ev.startSec) return "future";
  return "active";
}

/** Any task before the live focus row is done (fixes past rows mirroring the next countdown). */
function getTaskPhase(ev, ctx){
  const { focusStartSec } = ctx;
  if (focusStartSec != null && ev.startSec < focusStartSec) return "ended";
  return getTaskPhaseByTime(ev, ctx);
}

function hasImmediateNextPhase(schedule, ev){
  const idx = schedule.findIndex(e => e.startSec === ev.startSec);
  return (
    idx >= 0 &&
    idx + 1 < schedule.length &&
    schedule[idx + 1].startSec === schedule[idx].endSec
  );
}

/** First row whose right-hand timer is live (not ended “–” / pending “–”). */
function resolveTaskListFocus(schedule, ctx){
  for (const ev of schedule){
    const phase = getTaskPhaseByTime(ev, ctx);
    if (phase === "ended") continue;
    if (phase === "active" && hasImmediateNextPhase(schedule, ev)) continue;
    return { ev, phase };
  }
  return null;
}

function countdownSecToTaskStart(ev, ctx){
  if (ctx.dayKey){
    const startMs = zonedWallClockToMs(ctx.dayKey, ev.startMin, scheduleTz);
    return Math.max(0, Math.floor((startMs - ctx.nowMs) / 1000));
  }
  return Math.max(0, ev.startSec - ctx.nowSec);
}

function countdownSecToTaskEnd(ev, ctx){
  if (ctx.dayKey){
    const endMs = zonedWallClockToMs(ctx.dayKey, Math.floor(ev.endSec / 60), scheduleTz);
    return Math.max(0, Math.floor((endMs - ctx.nowMs) / 1000));
  }
  return Math.max(0, ev.endSec - ctx.nowSec);
}

function computeTaskRowDisplay(ev, ctx){
  const { activeEv, schedule, focusStartSec } = ctx;
  const phase = getTaskPhase(ev, ctx);
  const isFocus = focusStartSec != null && ev.startSec === focusStartSec;
  const showSeconds = isFocus;
  let cls = "task-timer-row";
  let cd = "";
  let numsExtraClass = "";

  if (phase === "ended"){
    cd = taskCountdownEndedHtml();
    return { cls, cd, numsExtraClass, isFocus };
  }

  if (phase === "future"){
    cd = taskCountdownHtml(countdownSecToTaskStart(ev, ctx), showSeconds);
    return { cls, cd, numsExtraClass, isFocus };
  }

  const activeStart = activeEv ? activeEv.startSec : null;
  const isActive = activeStart !== null && ev.startSec === activeStart;
  if (isActive) cls += " is-active";

  if (isActive && hasImmediateNextPhase(schedule, ev)){
    cd = "";
    numsExtraClass = " task-timer-nums--pending";
  } else {
    cd = taskCountdownHtml(countdownSecToTaskEnd(ev, ctx), showSeconds);
  }
  return { cls, cd, numsExtraClass, isFocus };
}

function taskTimerRowHtml(ev, display){
  const { cls, cd, numsExtraClass, isFocus } = display;
  const focusMark = isFocus ? " task-timer-row--focus" : "";
  const tStart = formatHMfromSeconds(ev.startSec);
  const name = escapeHtml(ev.name || "(no label)");
  return (
    `<div class="${cls}${focusMark}" data-start-sec="${ev.startSec}">` +
      `<div class="task-timer-meta">` +
      `<span class="task-timer-start nums">${tStart}</span>` +
      `<span class="task-timer-name">${name}</span>` +
      `</div>` +
      `<div class="task-timer-nums nums${numsExtraClass}">${cd}</div>` +
    `</div>`
  );
}

function taskListStructureKey(schedule, ctx, activeEv, focusStartSec){
  const states = schedule.map(ev => {
    const phase = getTaskPhase(ev, ctx);
    if (phase === "ended") return "e";
    if (phase === "future") return "f";
    return hasImmediateNextPhase(schedule, ev) ? "p" : "a";
  }).join("");
  const activeStart = activeEv ? activeEv.startSec : "n";
  const dayKey = ctx.dayKey || "day";
  return `${dayKey}|${schedule.length}|${focusStartSec ?? "n"}|${activeStart}|${states}`;
}

function bindTaskTimersScroll(){
  const el = document.getElementById("taskTimersList");
  if (!el || el.dataset.scrollBound) return;
  el.dataset.scrollBound = "1";
  const mark = () => { taskListUserInteractedAt = Date.now(); };
  el.addEventListener("scroll", mark, { passive: true });
  el.addEventListener("wheel", mark, { passive: true });
  el.addEventListener("touchstart", mark, { passive: true });
}

function scrollTaskListToFocus(focusStartSec, opts = {}){
  const scrollEl = document.getElementById("taskTimersList");
  if (!scrollEl || focusStartSec == null) return;

  const focusAdvanced = lastAutoScrollFocusStartSec !== focusStartSec;
  const userRecentlyScrolled = (Date.now() - taskListUserInteractedAt) < 15000;
  if (!opts.force && !focusAdvanced && userRecentlyScrolled) return;

  const row = scrollEl.querySelector(".task-timer-row--focus");
  if (!row) return;

  lastAutoScrollFocusStartSec = focusStartSec;
  scrollEl.scrollTo({
    top: Math.max(0, row.offsetTop),
    behavior: opts.animate ? "smooth" : "auto",
  });
}

function buildTaskListContext(schedule, venueCtx, activeEv, previewDayKey){
  const dayKey = previewDayKey ?? null;
  const listCtx = {
    now: venueCtx.now,
    nowSec: venueCtx.nowSec,
    nowMs: venueCtx.nowMs,
    dayKey,
    activeEv,
    schedule,
  };
  const focus = resolveTaskListFocus(schedule, listCtx);
  listCtx.focusStartSec = focus ? focus.ev.startSec : null;
  return listCtx;
}

function updateTaskListCountdownsInPlace(schedule, listCtx){
  const scrollEl = document.getElementById("taskTimersList");
  if (!scrollEl) return;
  for (const ev of schedule){
    const row = scrollEl.querySelector(`[data-start-sec="${ev.startSec}"]`);
    if (!row) continue;
    const display = computeTaskRowDisplay(ev, listCtx);
    row.className = display.cls + (display.isFocus ? " task-timer-row--focus" : "");
    const nums = row.querySelector(".task-timer-nums");
    if (!nums) continue;
    nums.className = `task-timer-nums nums${display.numsExtraClass}`;
    nums.innerHTML = display.cd;
  }
}

function buildTaskTimersHtml(schedule, listCtx){
  if (!schedule.length){
    return "<div class=\"task-timers-empty\">No tasks loaded</div>";
  }
  return schedule.map(ev => taskTimerRowHtml(ev, computeTaskRowDisplay(ev, listCtx))).join("");
}

function refreshTaskTimersList(schedule, ctx, activeEv, _nextTaskStartSec, previewDayKey){
  const scrollEl = document.getElementById("taskTimersList");
  if (!scrollEl) return;

  bindTaskTimersScroll();

  const listCtx = buildTaskListContext(schedule, ctx, activeEv, previewDayKey);
  const key = taskListStructureKey(schedule, listCtx, activeEv, listCtx.focusStartSec);
  const rebuild = key !== lastTaskListStructureKey;

  if (rebuild){
    lastTaskListStructureKey = key;
    scrollEl.innerHTML = buildTaskTimersHtml(schedule, listCtx);
    requestAnimationFrame(() => {
      scrollTaskListToFocus(listCtx.focusStartSec, { force: true, animate: false });
    });
    return;
  }

  updateTaskListCountdownsInPlace(schedule, listCtx);

  if (listCtx.focusStartSec != null && lastAutoScrollFocusStartSec !== listCtx.focusStartSec){
    requestAnimationFrame(() => {
      scrollTaskListToFocus(listCtx.focusStartSec, { force: true, animate: true });
    });
  }
}

function nextTaskStartSecOnDay(schedule, ctx, dayKey){
  for (const ev of schedule){
    if (ctx.nowMs < zonedWallClockToMs(dayKey, ev.startMin, scheduleTz)) return ev.startSec;
  }
  return null;
}

function findEventByStartSec(startSec){
  if (startSec == null) return null;
  return schedule.find(ev => ev.startSec === startSec) ?? null;
}

/** Races on first-race calendar day (M24) still in the future — for Friday “Up next”. */
function upcomingRacesOnFirstRaceDay(ctx){
  if (!firstRaceDateKey) return [];
  const races = dedupeRacePhasesByLogicalRace(
    schedule.filter(isRace).sort((a, b) => a.startSec - b.startSec)
  );
  return races.filter(
    ev => ctx.nowMs < zonedWallClockToMs(firstRaceDateKey, ev.startMin, scheduleTz)
  );
}

function renderFridayPreFirstRace(ctx){
  const deltaSec = Math.max(0, Math.floor((firstRaceInstantMs - ctx.nowMs) / 1000));
  const venueTodayKey = ctx.dateKey;
  const nextTaskStartSec = nextTaskStartSecOnDay(schedule, ctx, venueTodayKey);
  const nextTask = findEventByStartSec(nextTaskStartSec);

  if (nextTask){
    document.getElementById("nextTaskTime").textContent = formatHMfromSeconds(nextTask.startSec);
    document.getElementById("nextTaskName").textContent = nextTask.name ? nextTask.name : "—";
    document.getElementById("nextTaskBox").classList.remove("next-task-empty");
  } else {
    document.getElementById("nextTaskTime").textContent = "";
    document.getElementById("nextTaskName").textContent = "No upcoming tasks";
    document.getElementById("nextTaskBox").classList.add("next-task-empty");
  }

  refreshTaskTimersList(schedule, ctx, null, nextTaskStartSec, venueTodayKey);

  document.getElementById("raceCountdownTitle").textContent = "First Race";
  const raceCd = document.getElementById("raceCountdown");
  raceCd.textContent = formatCountdownToFirstRace(deltaSec);
  raceCd.classList.remove("is-closed");

  const racePhases = upcomingRacesOnFirstRaceDay(ctx);
  if (racePhases.length){
    const lines = racePhases.slice(0, 4).map(ev => upNextRaceLineHtml(ev)).join("");
    document.getElementById("upNextRaces").innerHTML =
      `<div class="listBlock-inner">${lines}</div>`;
  } else {
    document.getElementById("upNextRaces").innerHTML =
      "<div class=\"upnext-msg muted\">No upcoming races</div>";
  }
}

function render(){
  const ctx = scheduleNowContext(new Date());
  document.getElementById("currentTimeLabel").textContent =
    `Current time (${scheduleTzShortLabel()})`;
  document.getElementById("now").textContent = formatHMS(ctx.now);

  document.getElementById("msg").textContent = loadError;

  const closed = isSailingWindowClosed(ctx.now);
  if (closed){
    document.getElementById("nextTaskTime").textContent = "";
    document.getElementById("nextTaskName").textContent = "—";
    document.getElementById("nextTaskBox").classList.add("next-task-empty");

    document.getElementById("taskTimersList").innerHTML = "";
    lastTaskListStructureKey = "";
    lastAutoScrollFocusStartSec = null;

    document.getElementById("raceCountdownTitle").textContent = "";
    const raceCd = document.getElementById("raceCountdown");
    raceCd.textContent = "SAILING WINDOW CLOSED";
    raceCd.classList.add("is-closed");

    document.getElementById("upNextRaces").innerHTML = "";

    return;
  }

  if (isFridayPreFirstRaceMode(ctx.now)){
    renderFridayPreFirstRace(ctx);
    return;
  }

  // NEXT TASK — from next upcoming phase after now (venue TZ)
  const taskChain = chainAfterNowSec(ctx.nowSec, null);
  const nextTaskInfo = taskChain.length
    ? { next: taskChain[0], deltaSec: Math.max(0, taskChain[0].startSec - ctx.nowSec) }
    : null;

  if (nextTaskInfo){
    const { next } = nextTaskInfo;
    document.getElementById("nextTaskTime").textContent = formatHMwithFixedSec(next.startSec);
    document.getElementById("nextTaskName").textContent = next.name ? next.name : "—";
    document.getElementById("nextTaskBox").classList.remove("next-task-empty");
  } else {
    document.getElementById("nextTaskTime").textContent = "";
    document.getElementById("nextTaskName").textContent = "No upcoming tasks";
    document.getElementById("nextTaskBox").classList.add("next-task-empty");
  }

  const active = findActive(ctx.now);
  const nextTaskStartSec = taskChain.length ? taskChain[0].startSec : null;
  refreshTaskTimersList(schedule, ctx, active, nextTaskStartSec, null);

  // NEXT RACE — one entry per logical race (see dedupeRacePhasesByLogicalRace)
  const raceChain = raceChainAfterNowSec(ctx.nowSec);
  const nextRaceInfo = raceChain.length
    ? { next: raceChain[0], deltaSec: Math.max(0, raceChain[0].startSec - ctx.nowSec) }
    : null;

  if (nextRaceInfo){
    const { next, deltaSec } = nextRaceInfo;
    document.getElementById("raceCountdownTitle").textContent = next.name ? next.name : "Next race";
    const raceCd = document.getElementById("raceCountdown");
    raceCd.textContent = formatCountdown(deltaSec);
    raceCd.classList.remove("is-closed");
  } else {
    document.getElementById("raceCountdownTitle").textContent = schedule.length ? "No upcoming races" : "";
    const raceCd = document.getElementById("raceCountdown");
    raceCd.textContent = "--:--:--";
    raceCd.classList.remove("is-closed");
  }

  // Up next (races) — after immediate next race
  if (schedule.length){
    const upcomingRaceEvs = raceChain.slice(1, 4);

    let racesHtml;
    if (upcomingRaceEvs.length){
      racesHtml = `<div class="listBlock-inner">${upcomingRaceEvs.map(ev => upNextRaceLineHtml(ev)).join("")}</div>`;
    } else if (!raceChain.length){
      racesHtml = "<div class=\"upnext-msg\">No upcoming races</div>";
    } else {
      racesHtml = "<div class=\"upnext-msg muted\">No more races</div>";
    }
    document.getElementById("upNextRaces").innerHTML = racesHtml;
  } else {
    document.getElementById("upNextRaces").textContent = "";
  }
}

async function tick(){
  const nowMs = Date.now();
  if (!lastFetchMs || (nowMs - lastFetchMs) > SCHEDULE_REFRESH_MS){
    await loadSchedule();
  }
  render();
}

(async function init(){
  bindTaskTimersScroll();
  if (!CSV_URL_BASE){
    document.getElementById("msg").textContent = "CSV_URL_BASE is empty.";
  } else {
    await loadSchedule();
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
